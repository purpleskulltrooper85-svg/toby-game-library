<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNF Freeplay</title><style>:root{--gold:#f6cc56;--line:rgba(255,255,255,.19);--text:#f7f4ea}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input{font:inherit}body{overflow:hidden;background:radial-gradient(circle at 50% 0%,#171204,#050505 70%)}.noise{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:.06;background-image:radial-gradient(#fff .65px,transparent .75px);background-size:4px 4px}.wrap{height:100%;display:grid;grid-template-rows:46px 1fr}header{display:flex;align-items:center;gap:9px;padding:0 16px;background:rgba(5,5,5,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);color:var(--gold);font:900 22px/1 Impact,Arial Black,sans-serif;letter-spacing:-1px}header img{width:26px;height:26px;border-radius:7px;object-fit:cover;border:1px solid var(--gold)}.freeplay{overflow:auto;padding:23px 30px}.freehead{display:flex;justify-content:space-between;align-items:end;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}.freehead h1{margin:0;color:var(--gold);font:900 clamp(36px,6vw,66px)/.85 Impact,Arial Black,sans-serif;letter-spacing:-3px}.freehead p{margin:9px 0 0;color:#c8c4b9;font-size:13px}#search{width:min(280px,100%);padding:10px 11px;border:1px solid #777;background:#080808;color:#fff;outline:none}#search:focus{border-color:var(--gold);box-shadow:0 0 18px rgba(246,204,86,.22)}.meta{display:flex;justify-content:space-between;margin:16px 0 10px;color:#aaa;font-size:10px;letter-spacing:1px;text-transform:uppercase}#list{border-top:1px solid #4b4b4b}.track{width:100%;display:grid;grid-template-columns:35px 1fr 75px;gap:10px;align-items:center;padding:12px 11px;border:0;border-bottom:1px solid #292929;background:#0c0c0c;color:#f5f3ed;text-align:left;cursor:pointer;transition:.14s}.track:hover,.track:focus{background:linear-gradient(90deg,var(--gold),#f5f2e8);color:#080808;outline:0}.number{color:var(--gold);font-weight:800;font-size:12px}.track:hover .number{color:#70510c}.trackname{font-weight:800;font-size:14px;text-transform:uppercase;overflow-wrap:anywhere}.type{font-size:10px;color:#aaa;text-transform:uppercase}.track:hover .type{color:#5b5b5b}.player{display:none;position:fixed;inset:0;z-index:50;background:#000}.player.open{display:grid;grid-template-rows:54px 1fr}.playerbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(90deg,#111,#2b210d);border-bottom:1px solid rgba(246,204,86,.45)}.playing{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold);font-weight:800;font-size:13px}iframe{width:100%;height:100%;border:0;background:#000}.toast{position:fixed;left:50%;bottom:65px;z-index:79;transform:translate(-50%,18px);opacity:0;padding:10px 14px;border:1px solid rgba(246,204,86,.6);border-radius:5px;background:rgba(10,10,10,.94);color:#f7e5a3;font-size:12px;transition:.2s;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}.loading{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:radial-gradient(circle at 50% 40%,#211a08,#050505 63%)}.loading.show{display:grid}.loadbox{width:min(420px,calc(100% - 44px));padding:32px 28px;border:1px solid rgba(246,204,86,.5);background:linear-gradient(145deg,rgba(26,22,11,.96),rgba(7,7,7,.97));box-shadow:0 30px 80px #000;text-align:center}.loader-img{width:116px;height:116px;object-fit:cover;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 38px rgba(246,204,86,.42);animation:pulse 1.1s ease-in-out infinite}.loader-title{margin:15px 0 18px;color:var(--gold);font:900 36px/1 Impact,Arial Black,sans-serif;letter-spacing:-1px}.loadbar{position:relative;height:16px;overflow:hidden;border:1px solid #a98e3a;background:#0b0b0b}.loadfill{width:0;height:100%;background:linear-gradient(90deg,#815b12,#d9a82f 35%,#fff2a6 55%,#f6cc56 75%,#9d7018);transition:width .11s linear}.loadrow{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:#e7dfc9;font-size:11px;letter-spacing:.7px;text-transform:lowercase}@keyframes pulse{50%{transform:scale(1.055)}}@media(max-width:720px){.freeplay{padding:17px}.freehead{display:block}#search{margin-top:14px}.track{grid-template-columns:30px 1fr 55px}}</style></head><body><div class="noise"></div><div class="wrap"><header><img src="https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/randostuff@main/FNF_MOBILE_ICON.webp" alt="">FNF · Freeplay</header><div class="freeplay"><div class="freehead"><div><h1>freeplay</h1><p>Click a game to launch it.</p></div><input id="search" placeholder="Search games…" autocomplete="off"></div><div class="meta"><span>FNF game list</span><span id="count"></span></div><div id="list"></div></div></div><div class="toast" id="toast"></div><div class="loading" id="loading"><div class="loadbox"><img class="loader-img" src="https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/randostuff@main/FNF_MOBILE_ICON.webp" alt=""><div class="loader-title">loading</div><div class="loadbar"><div class="loadfill" id="loadfill"></div></div><div class="loadrow"><span id="loadtext">loading game:</span><span id="percent">0%</span></div></div></div><div class="player" id="player"><div class="playerbar"><span class="playing" id="playing">Loading…</span><button class="control" id="reload">Reload</button><button class="control" id="full">Fullscreen</button><button class="control" id="aboutBlank">Open about:blank</button><button class="control" id="download">Download</button><button class="control" id="close">× Close</button></div><iframe id="frame" title="Game player" allowfullscreen></iframe></div><audio id="hoverSound" preload="auto" src="https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/randostuff@main/ClickUp.ogg"></audio><audio id="confirmSound" preload="auto" src="https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/randostuff@main/confirmMenu.ogg"></audio><audio id="cancelSound" preload="auto" src="https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/randostuff@main/cancelMenu.ogg"></audio><script>
const games=["clfnfaethos", "clfnfagoti", "clfnfakage", "clfnfanimation", "clfnfannie", "clfnfasdf", "clfnfbelowdepths", "clfnfbfdi26", "clfnfbinarybreakdown", "clfnfblackbetrayal", "clfnfbside", "clfnfcamelliarudeblaster", "clfnfcandycarrier", "clfnfchara", "clfnfcitytales", "clfnfclassified", "clfnfcorrosion", "clfnfcory", "clfnfcrunchin", "clfnfdeciever", "clfnfdesolation", "clfnfdocumictxtv3", "clfnfdokitakeoverplus", "clfnfdropandroll", "clfnfdsides", "clfnfdustin", "clfnfdusttale", "clfnffleetway", "clfnfflippedout", "clfnffnaf1", "clfnffnaf2", "clfnffnaf3", "clfnffnatpt", "clfnfgamebreakerbundle", "clfnfgfmode", "clfnfgodot", "clfnfgoldenapple", "clfnfhank", "clfnfheartbreakhavoc", "clfnfherobrine", "clfnfhex", "clfnfholiday", "clfnfhorkglorpgloop", "clfnfhotline", "clfnfhypnoslullaby", "clfnfimposter3", "clfnfimposterv4", "clfnfindiecross", "clfnfinfernalbout", "clfnfinfiniteirida", "clfnfironlung", "clfnfjapcreepypasta", "clfnfmadnesspoop", "clfnfmaginagematches", "clfnfmariomadnessdside", "clfnfmarioport", "clfnfmcmadness", "clfnfmidfight", "clfnfmiku", "clfnfmobmod", "clfnfneo", "clfnfpiggyfield", "clfnfplutoshi", "clfnfpokepastaperdition", "clfnfporifera", "clfnfqt", "clfnfremnants", "clfnfretrospecter", "clfnfrevmixed", "clfnfrewrite", "clfnfrhythmicrev", "clfnfrottensmoothie", "clfnfselfpaced", "clfnfshaggy4keys", "clfnfshaggyxmatt", "clfnfshucks-v2", "clfnfshucksv2", "clfnfsky", "clfnfsoft", "clfnfsonicexe", "clfnfsonicexe4", "clfnfstarlightmayhem", "clfnfstridentcrisis", "clfnftailsgetstrolled", "clfnftooslowfran", "clfnftricky", "clfnfTWIDDLEFINGER", "clfnfundertale", "clfnfvoid", "clfnfvstabi", "clfnfwaltenfiles", "clfnfwednesday-infedility", "clfnfwhitty", "clfnfzardy", "clfnfsohv2"],base='https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/';
const $=s=>document.querySelector(s),hs=$('#hoverSound'),cs=$('#confirmSound'),xs=$('#cancelSound');
function sound(a){a.currentTime=0;a.play().catch(()=>{})}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>x.classList.remove('show'),1800)}
function gameUrl(g){return base+encodeURIComponent(g.includes('.')?g:g+'.html')+'?t='+Date.now()}
function name(g){return g.replace(/^cl/i,'').replace(/^fnf/i,'FNF ').replace(/([a-z])([A-Z])/g,'$1 $2')}
let lastHtml='',lastTitle='game',lastUrl='';
async function fetchHtml(url){let r=await fetch(url);if(!r.ok)throw Error();return r.text()}
function launch(title,url){lastTitle=title;lastUrl=url;let l=$('#loading'),f=$('#loadfill'),p=$('#percent'),t=$('#loadtext'),n=0;t.textContent='loading game: '+title.toLowerCase();f.style.width='0%';p.textContent='0%';l.classList.add('show');let timer=setInterval(()=>{n=Math.min(91,n+4+Math.random()*9);f.style.width=n+'%';p.textContent=Math.floor(n)+'%'},100);let fr=$('#frame');$('#player').classList.add('open');$('#playing').textContent='Loading '+title+'…';fr.src='about:blank';fetchHtml(url).then(h=>{lastHtml=h;let d=fr.contentWindow.document;d.open();d.write(h);d.close();$('#playing').textContent=title}).catch(()=>{lastHtml='';fr.srcdoc='<style>body{background:#000;color:#fff;font-family:Arial;padding:30px}</style><h2>Could not load this game</h2>';$('#playing').textContent='Load failed'}).finally(()=>new Promise(r=>setTimeout(()=>{clearInterval(timer);f.style.width='100%';p.textContent='100%';setTimeout(()=>{l.classList.remove('show');r()},260)},250)))}
function render(){let q=$('#search').value.toLowerCase().trim(),shown=games.filter(g=>name(g).toLowerCase().includes(q));$('#count').textContent=shown.length+' games';let list=$('#list');list.replaceChildren();shown.forEach((g,i)=>{let b=document.createElement('button');b.className='track';b.innerHTML='<span class="number">'+String(i+1).padStart(2,'0')+'</span><span class="trackname"></span><span class="type">FNF Mod</span>';b.querySelector('.trackname').textContent=name(g);b.onpointerenter=()=>sound(hs);b.onclick=()=>{sound(cs);launch(name(g),gameUrl(g))};list.append(b)})}
$('#search').oninput=render;
$('#reload').onclick=()=>{if(lastUrl)launch(lastTitle,lastUrl)};
$('#close').onclick=()=>{sound(xs);$('#frame').src='about:blank';$('#frame').srcdoc='';$('#player').classList.remove('open')};
$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('#player').requestFullscreen&&$('#player').requestFullscreen();
$('#aboutBlank').onclick=()=>{let w=window.open('about:blank','_blank');if(!w){toast('Pop-up blocked — allow pop-ups and try again');return}w.document.open();w.document.write(lastHtml||'<!doctype html><title>FNF</title><p>Launch a game first.</p>');w.document.close()};
$('#download').onclick=()=>{if(!lastHtml)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lastHtml],{type:'text/html'}));a.download=lastTitle.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();
</script></body></html>
